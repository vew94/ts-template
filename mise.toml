[tools]
betterleaks = "1.8.1"
ghalint = "1.5.6"
node = "26.8.1"
pnpm = "11.25.0"

[tasks.build]
description = "Build"
run = [{ tasks = ["check"] }]

[tasks.check]
description = "Check code quality"
run = [
  "betterleaks git --no-banner",
  "pnpm audit",
  "pnpm exec tsc --noEmit",
  "pnpm exec oxfmt --check --no-error-on-unmatched-pattern",
  "pnpm exec oxlint --no-error-on-unmatched-pattern",
  "ghalint run",
]

[tasks.fix]
description = "Fix lint and formatting issues"
run = ["pnpm exec oxlint --fix --fix-suggestions", "pnpm exec oxfmt --write"]
